{% extends "base.html" %}
{% block title %}Créer un compte — TAPBusiness{% endblock %}
{% block content %}
<h1>Créer un compte</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">S'inscrire</button>
</form>
<p>Déjà un compte ? <a href="{% url 'accounts:login' %}">Se connecter</a></p>
{% endblock %}
