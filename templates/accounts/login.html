{% extends "base.html" %}
{% block title %}Connexion — TAPBusiness{% endblock %}
{% block content %}
<h1>Connexion</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit">Se connecter</button>
</form>
<p><a href="{% url 'accounts:password_reset' %}">Mot de passe oublié ?</a></p>
<p>Pas de compte ? <a href="{% url 'accounts:signup' %}">Créer un compte</a></p>
{% endblock %}
