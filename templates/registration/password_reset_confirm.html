{% extends "base.html" %}
{% block title %}Nouveau mot de passe — TAPBusiness{% endblock %}
{% block content %}
<h1>Nouveau mot de passe</h1>
{% if validlink %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Changer le mot de passe</button>
</form>
{% else %}
<p>Ce lien est invalide ou a expiré. <a href="{% url 'accounts:password_reset' %}">Demander un nouveau lien</a></p>
{% endif %}
{% endblock %}
