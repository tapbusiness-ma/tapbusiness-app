<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TAPBusiness{% endblock %}</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 480px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        input, button {
            display: block;
            width: 100%;
            margin: .5rem 0;
            padding: .6rem;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            background: #16a34a;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
